name: i18n branch validation

on:
  push:
    branches:
      - feat/contributor-friendly-i18n-ar
  workflow_dispatch:

concurrency:
  group: i18n-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - name: Validate ARB translation catalogs
        run: python3 scripts/check_l10n.py
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.9"
          cache: true
      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Generate localization bindings
        run: flutter gen-l10n
      - name: Static analysis
        run: flutter analyze
      - name: Run tests
        run: flutter test
